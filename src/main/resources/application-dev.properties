# GitHub API Configuration
github.api.token=${GITHUB_TOKEN:}
github.api.timeout=10000
github.api.cache-ttl=300

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.endpoint=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama3-8b-8192
groq.api.timeout=30000
groq.api.max-tokens=500
groq.api.temperature=0.7

# Application Configuration
app.job.max-retries=3
app.job.retry-delay-ms=5000
app.worker.poll-interval-ms=2000
app.worker.batch-size=5
app.rate-limit.requests-per-second=5
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Logging Configuration
logging.level.com.graphify.graphify_system=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR