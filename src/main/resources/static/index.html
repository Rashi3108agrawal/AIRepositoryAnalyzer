<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphify - Redirecting...</title>
    <script>
        // Redirect to the new app
        window.location.href = '/app.html';
    </script>
</head>
<body>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #030712 0%, #0f172a 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;">
        <div style="text-align: center; color: #e2e8f0;">
            <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
            <h1 style="margin: 0 0 8px 0; font-size: 24px;">Graphify</h1>
            <p style="margin: 0; color: rgba(226, 232, 240, 0.6);">Loading your dashboard...</p>
        </div>
    </div>

    <script>
        // Suppress console errors from browser extensions
        if (typeof window !== 'undefined') {
            window.onerror = function(msg, url, lineNo, columnNo, error) {
                if (msg && (msg.includes('tabs:outgoing') || msg.includes('messaging'))) {
                    return true;
                }
                return false;
            };

            window.addEventListener('unhandledrejection', event => {
                if (event.reason && typeof event.reason === 'object' &&
                    (event.reason.message?.includes('tabs:outgoing') ||
                     event.reason.message?.includes('messaging'))) {
                    event.preventDefault();
                }
            });
        }
    </script>
</body>
</html>
